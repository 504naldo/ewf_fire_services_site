name: PR 21 isolated browser QA
on:
  push:
    branches: [qa/pr-21-browser]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      QA_SCREENSHOTS: /tmp/ewf-warning-screenshots
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/*.test.cjs
      - run: npm install --prefix "$RUNNER_TEMP/ewf-qa" --no-audit --no-fund --ignore-scripts playwright@1.56.1
      - name: Inspect focus and native navigation signals
        run: NODE_PATH="$RUNNER_TEMP/ewf-qa/node_modules" CHROME_BIN="$(which google-chrome)" timeout 30 node audit/diagnose.cjs
        continue-on-error: true
      - name: Run rendered site and contact-form tests
        run: |
          google-chrome --version
          mkdir -p "$QA_SCREENSHOTS"
          NODE_PATH="$RUNNER_TEMP/ewf-qa/node_modules" CHROME_BIN="$(which google-chrome)" node --test --test-timeout=22000 tests/browser/enquiry.cjs tests/browser/site.cjs
      - name: Save warning screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: warning-screenshots
          path: ${{ env.QA_SCREENSHOTS }}
          retention-days: 7
