
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Thank you for contacting EWF Fire Services" />
  <title>Thank You - EWF Fire Services</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root { 
      --earth: #857347; 
      --wind: #547a89; 
      --fire: #a75312; 
      --light-bg: #f9f9f9;
      --white: #ffffff;
      --text-dark: #333;
    }
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
      background: var(--light-bg); 
      color: var(--text-dark); 
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    
    .skip-link { position: absolute; left: -9999px; top: 0; z-index: 9999; background: #252a2d; color: #fff; padding: .75rem 1rem; }
    .skip-link:focus { left: 1rem; top: 1rem; }

    .thank-you-container {
      background: var(--white);
      padding: 4rem 3rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 600px;
      border-top: 4px solid var(--fire);
    }
    
    .thank-you-container > .status-icon {
      font-size: 4rem;
      color: var(--fire);
      margin-bottom: 1.5rem;
    }
    
    .thank-you-container h1 {
      font-size: 2.5rem;
      color: var(--text-dark);
      margin-bottom: 1rem;
      font-weight: 700;
    }
    
    .thank-you-container p {
      font-size: 1.1rem;
      color: #666;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    
    .btn-home {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: var(--fire);
      color: var(--white);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(167, 83, 18, 0.3);
    }
    
    .btn-home:hover {
      background: #8b4410;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(167, 83, 18, 0.4);
    }
    
    @media (max-width: 768px) {
      .thank-you-container {
        padding: 3rem 2rem;
      }
      
      .thank-you-container h1 {
        font-size: 2rem;
      }
      
      .thank-you-container > .status-icon {
        font-size: 3rem;
      }
    }
  </style>
  <script src="/enquiry.js"></script>
  <script src="/canonical.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9ZJPP9CTGQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9ZJPP9CTGQ', window.ewfAnalyticsPage || {});
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" tabindex="-1" class="thank-you-container">
    <img src="/logo.png" alt="EWF Fire Services" style="width:180px;max-width:100%;height:auto;margin:0 auto 1.5rem;display:block" />
    <i class="fas fa-check-circle status-icon" aria-hidden="true"></i>
    <h1>Thank You!</h1>
    <p>Thank you for contacting EWF Fire Services. For time-sensitive service needs or to follow up on your request, call <a href="tel:6046495665">604-649-5665</a> or email <a href="mailto:office@ewandf.ca">office@ewandf.ca</a>.</p>
    <a href="/" class="btn-home"><i class="fas fa-home"></i> Return to Home</a>
  </main>
</body>
</html>
